<style>
/* Layout: a vertical stack of full-width colour bands, one per chapter (chat, voice, pebbles, casino, drops, cards, rivalries, chaos), each a big headline then a wrapping grid of award cards. One deliberate look: dark, saturated duotone fields — no light theme on purpose. */
:root {
  color-scheme: dark;
  --ink: #fbf8ff;
  --ink-2: rgba(251, 248, 255, 0.78);
  --ink-3: rgba(251, 248, 255, 0.56);
  --base: #0b0a10;
  --card: rgba(255, 255, 255, 0.07);
  --card-line: rgba(255, 255, 255, 0.14);
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--base); color: var(--ink); font: 16px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
.band { --bg: #2b0b52; --hot: #ff4fd8; --cool: #6d3bff; position: relative; overflow: hidden; background: var(--bg); }
.band::before { content: ""; position: absolute; inset: -20% -10%; background:
  radial-gradient(40% 50% at 85% 10%, color-mix(in oklab, var(--hot) 55%, transparent), transparent 70%),
  radial-gradient(45% 55% at 5% 95%, color-mix(in oklab, var(--cool) 60%, transparent), transparent 70%); pointer-events: none; }
.inner { position: relative; max-width: 1180px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-block: 72px 80px; display: grid; gap: 34px; }
.kicker { font: 700 12px/1 var(--display); letter-spacing: 0.16em; text-transform: uppercase; color: var(--hot); }
h1, h2, h3 { margin: 0; font-family: var(--display); text-wrap: balance; }
h1 { font-size: clamp(40px, 9vw, 112px); font-weight: 900; line-height: 0.95; letter-spacing: -0.03em; }
h2 { font-size: clamp(30px, 5.4vw, 64px); font-weight: 900; line-height: 1; letter-spacing: -0.02em; }
.lead { font-size: clamp(17px, 2vw, 21px); color: var(--ink-2); max-width: 60ch; margin: 0; }
.head { display: grid; gap: 14px; }

.big { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); gap: 26px 34px; }
.big .n { font: 900 clamp(34px, 4.4vw, 56px)/1 var(--display); overflow-wrap: anywhere; letter-spacing: -0.03em; color: var(--ink); font-variant-numeric: tabular-nums; }
.big .k { color: var(--ink-2); font-size: 15px; margin-top: 6px; }
.big > div { border-top: 3px solid var(--hot); padding-top: 14px; min-width: 0; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 18px; align-items: start; }
.award { background: var(--card); border: 1px solid var(--card-line); border-radius: 22px; padding: 22px; display: grid; gap: 14px; min-width: 0; backdrop-filter: blur(6px); }
.award.wide { grid-column: 1 / -1; }
.award .label { font: 700 12px/1.2 var(--display); text-transform: uppercase; letter-spacing: 0.12em; color: var(--hot); }
.winner { display: flex; align-items: center; gap: 14px; min-width: 0; }
.winner .who { min-width: 0; display: grid; gap: 2px; }
.winner .name { font: 700 clamp(17px, 1.8vw, 21px)/1.15 var(--display); overflow-wrap: anywhere; }
.winner .duo + .who .name { font-size: clamp(15px, 1.5vw, 18px); }
.winner .handle { font-size: 13px; color: var(--ink-3); overflow-wrap: anywhere; }
.stat { font-size: 17px; color: var(--ink); margin: 0; }
.stat b { font-family: var(--display); font-weight: 700; }
.note { font-size: 14px; color: var(--ink-2); margin: 0; }
.av { width: 64px; height: 64px; border-radius: 50%; flex: none; object-fit: cover; background: color-mix(in oklab, var(--hot) 40%, var(--bg)); display: grid; place-items: center; font: 700 24px/1 var(--display); color: var(--ink); box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--hot); }
.av.sm { width: 26px; height: 26px; font-size: 11px; box-shadow: none; }
.duo { display: flex; flex: none; }
.duo .av + .av { margin-left: -18px; }
.runners { list-style: none; margin: 0; padding: 12px 0 0; border-top: 1px solid var(--card-line); display: grid; gap: 8px; }
.runners li { display: grid; grid-template-columns: 20px 26px 1fr auto; align-items: center; gap: 10px; font-size: 14.5px; color: var(--ink-2); }
.runners li .rk { font: 700 12px var(--display); color: var(--ink-3); }
.runners li .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.runners li .v { font-variant-numeric: tabular-nums; }
.runners li .duo .av.sm + .av.sm { margin-left: -9px; }
.runners li.pair { grid-template-columns: 20px 44px 1fr auto; }

.emoji { display: flex; flex-wrap: wrap; gap: 14px 18px; }
.emoji div { display: grid; justify-items: center; gap: 4px; min-width: 56px; }
.emoji .e { font-size: 40px; line-height: 1; height: 44px; display: grid; place-items: center; }
.emoji img { width: 42px; height: 42px; object-fit: contain; }
.emoji .c { font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; gap: 2px; }
.bar span { display: block; height: 100%; }
.keys { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-2); }
.keys i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; text-align: center; }
.vs .side { display: grid; justify-items: center; gap: 8px; min-width: 0; }
.vs .side .name { font: 700 17px/1.15 var(--display); overflow-wrap: anywhere; }
.vs .score { font: 900 34px/1 var(--display); color: var(--hot); white-space: nowrap; }
.vs .side .w { font-size: 13px; color: var(--ink-3); }

nav.chapters { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(11, 10, 16, 0.82); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.08); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: rgba(11, 10, 16, 0.95); }
nav.chapters .row { max-width: 1180px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
nav.chapters a { flex: none; color: var(--ink-2); text-decoration: none; font: 600 13px/1 var(--body); padding: 8px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14); }
nav.chapters a:hover, nav.chapters a:focus-visible { color: var(--ink); border-color: var(--ink-2); outline: none; }
section { scroll-margin-top: 60px; }
footer.inner { padding-block: 40px 60px; color: var(--ink-3); font-size: 14px; gap: 10px; }
footer p { margin: 0; max-width: 80ch; }

.c-intro { --bg: #22093f; --hot: #ff5ad9; --cool: #7b3dff; }
.c-chat { --bg: #062b23; --hot: #b6f53b; --cool: #0d8f6a; }
.c-voice { --bg: #08214f; --hot: #5cc8ff; --cool: #3a56ff; }

.c-drops { --bg: #023236; --hot: #3ff0d2; --cool: #1676b8; }
.c-cards { --bg: #1d0f45; --hot: #b9a1ff; --cool: #e04fb3; }
.c-rivals { --bg: #3a1405; --hot: #ff9147; --cool: #b8261b; }
.c-chaos { --bg: #150c0c; --hot: #ff4a3d; --cool: #5a1a8a; }
.c-outro { --bg: #2a0a3a; --hot: #ff7ad1; --cool: #ffb03d; }

const S = W.stats;
const fmt = (n) => Math.round(n).toLocaleString('en-US');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Names shown differently from their server nickname, at the owner's request.
const NAME_OVERRIDES = { '1531401125826138173': 'Batata' };
const P = (id) => {
  const p = W.people[id] ?? { name: 'someone', handle: null, avatar: null };
  return NAME_OVERRIDES[id] ? { ...p, name: NAME_OVERRIDES[id] } : p;
};
const hrs = (min) => fmt(min / 60);
const day = (ms) => new Date(ms).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
const plural = (n, one, many = one + 's') => `${fmt(n)} ${n === 1 ? one : many}`;
const GAME = { mines: 'Mines', hilo: 'Higher or Lower', blackjack: 'Blackjack', roulette: 'Roulette', slots: 'Slots' };
const KIND = { flag: 'Flags', capital: 'Capitals', sequence: 'Sequences', math: 'Math', scramble: 'Scramble', trivia: 'Trivia', grab: 'Grab' };

function av(id, sm = false) {
  const p = P(id);
  const initial = esc((p.name.trim()[0] ?? '?').toUpperCase());
  return p.avatar
    ? `<img class="av${sm ? ' sm' : ''}" src="${esc(p.avatar)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'av${sm ? ' sm' : ''}',textContent:'${initial}'}))">`
    : `<span class="av${sm ? ' sm' : ''}">${initial}</span>`;
}
const who = (id) => `<div class="who"><span class="name">${esc(P(id).name)}</span>${P(id).handle ? `<span class="handle">@${esc(P(id).handle)}</span>` : ''}</div>`;
const runners = (list, val, from = 1) => (list.length > from
  ? `<ol class="runners">${list.slice(from).map((x, i) => `<li><span class="rk">${i + from + 1}</span>${av(x.id, true)}<span class="nm">${esc(P(x.id).name)}</span><span class="v">${val(x)}</span></li>`).join('')}</ol>` : '');
const pairRunners = (list, val, from = 1) => (list.length > from
  ? `<ol class="runners">${list.slice(from).map((x, i) => `<li class="pair"><span class="rk">${i + from + 1}</span><span class="duo">${av(x.a, true)}${av(x.b, true)}</span><span class="nm">${esc(P(x.a).name)} & ${esc(P(x.b).name)}</span><span class="v">${val(x)}</span></li>`).join('')}</ol>` : '');

/** One award: who won, what for, and the runners-up. */
function award(label, list, stat, val, extra = '', wide = false) {
  if (!list || !list.length) return '';
  const w = list[0];
  return `<article class="award${wide ? ' wide' : ''}"><span class="label">${label}</span>
    <div class="winner">${av(w.id)}${who(w.id)}</div><p class="stat">${stat(w)}</p>${extra}${runners(list, val)}</article>`;
}
function pairAward(label, list, stat, val, extra = '') {
  if (!list || !list.length) return '';
  const w = list[0];
  return `<article class="award"><span class="label">${label}</span>
    <div class="winner"><span class="duo">${av(w.a)}${av(w.b)}</span><div class="who"><span class="name">${esc(P(w.a).name)} & ${esc(P(w.b).name)}</span></div></div>
    <p class="stat">${stat(w)}</p>${extra}${pairRunners(list, val)}</article>`;
}
function rivalry(label, r, game) {
  if (!r?.topPair) return '';
  const { a, b, games, wins, draws } = r.topPair;
  const wa = wins[a] ?? 0, wb = wins[b] ?? 0;
  const lead = wa === wb ? 'Dead level.' : `${esc(P(wa > wb ? a : b).name)} leads.`;
  return `<article class="award"><span class="label">${label}</span>
    <div class="vs"><div class="side">${av(a)}<span class="name">${esc(P(a).name)}</span></div><span class="score">${wa}–${wb}</span><div class="side">${av(b)}<span class="name">${esc(P(b).name)}</span></div></div>
    <p class="note">${plural(games, `${game} game`)} against each other${draws ? `, ${plural(draws, 'draw')}` : ''}. ${lead}</p></article>`;
}
const band = (id, cls, kicker, title, lead, body) => `<section id="${id}" class="band ${cls}"><div class="inner"><div class="head"><span class="kicker">${kicker}</span><h2>${title}</h2>${lead ? `<p class="lead">${lead}</p>` : ''}</div>${body}</div></section>`;
const bigs = (items) => `<div class="big">${items.filter(Boolean).map(([n, k]) => `<div><div class="n">${n}</div><div class="k">${k}</div></div>`).join('')}</div>`;

  ${award('The house thanks you', K.worstNet.filter((x) => x.v < 0), (w) => `Down <b>${fmt(-w.v)}</b> pebbles. The house thanks them.`, (x) => `−${fmt(-x.v)}`)}
  ${K.luckiest ? award('Luckiest at Mines', [{ id: K.luckiest.id }], () => `Hit <b>${fmt(K.luckiest.hit)}</b> mines when about ${fmt(K.luckiest.exp)} were expected.`, () => '') : ''}
  ${K.unluckiest && K.unluckiest.id !== K.luckiest?.id ? award('Unluckiest at Mines', [{ id: K.unluckiest.id }], () => `Hit <b>${fmt(K.unluckiest.hit)}</b> mines when about ${fmt(K.unluckiest.exp)} were expected. Pure bad luck.`, () => '') : ''}
  </div>`);

/* ---- drops & speedruns ---- */
const D = S.drops;
html += band('drops', 'c-drops', 'Chapter 5', 'Drops &amp; speedruns', `${fmt(D.total)} drops landed in chat and ${fmt(D.people)} different people won at least one. ${fmt(S.speedrunCount)} speedruns were attempted.`,
  `<div class="grid">
  ${award('Drop champion', D.winners, (w) => `Won <b>${fmt(w.v)}</b> drops. ${Math.round((100 * w.v) / D.total)}% of all of them.`, (x) => fmt(x.v))}
  ${award('On a roll', D.bestStreak, (w) => `Won <b>${w.v}</b> drops in a row.`, (x) => `${x.v} in a row`)}
  ${D.fastest ? award('Fastest fingers', [{ id: D.fastest.id }], () => `Answered a ${KIND[D.fastest.kind] ?? D.fastest.kind} drop in <b>${(D.fastest.ms / 1000).toFixed(1)} seconds</b>.`, () => '') : ''}
  ${S.speedruns.length ? `<article class="award"><span class="label">Speedrun records</span><ol class="runners" style="border-top:0;padding-top:0">${S.speedruns.map((r) => `<li><span class="rk"></span>${av(r.id, true)}<span class="nm">${esc(KIND[r.kind] ?? r.kind)}: ${esc(P(r.id).name)}</span><span class="v">${(r.ms / 1000).toFixed(1)}s</span></li>`).join('')}</ol><p class="note">The fastest perfect run of each kind.</p></article>` : ''}
  </div>`);

/* ---- cards ---- */
const CD = S.cards;
html += band('cards', 'c-cards', 'Chapter 6', 'Cards', `${fmt(CD.packs)} packs opened and ${fmt(CD.cards)} cards pulled. ${fmt(CD.totalSets)} people's sets were completed.`,
  `<div class="grid">
  ${award('Pack addict', CD.mostPacks, (w) => `Opened <b>${fmt(w.v)}</b> packs.`, (x) => fmt(x.v))}
  ${award('Collector', CD.mostCards, (w) => `Pulled <b>${fmt(w.v)}</b> cards.`, (x) => fmt(x.v))}
  ${award('Legendary luck', CD.legendaries, (w) => `<b>${plural(w.v, 'legendary', 'legendaries')}</b> pulled.`, (x) => fmt(x.v))}
  ${award('One of one', CD.specials, (w) => `Pulled <b>${plural(w.v, 'special card')}</b>, the 1-of-1 prints.`, (x) => fmt(x.v))}
  ${award('Comic hunter', CD.comics, (w) => `Found <b>${plural(w.v, 'comic page')}</b>.`, (x) => fmt(x.v))}
  ${award('Set finisher', CD.setsDone, (w) => `Completed <b>${plural(w.v, 'set')}</b>.`, (x) => fmt(x.v))}
  ${CD.firstCollection ? award('First to collect them all', [{ id: CD.firstCollection.id }], () => `Finished the whole collection first, on ${day(CD.firstCollection.at)}.`, () => '') : ''}
  ${award('Recycler', CD.recyclers, (w) => `Recycled spare cards <b>${plural(w.v, 'time')}</b>.`, (x) => fmt(x.v))}
  </div>`);

/* ---- rivalries ---- */
const tough = S.rps.hardestToBeat;
html += band('rivals', 'c-rivals', 'Chapter 7', 'Rivalries', `${fmt(S.rps.games)} rock paper scissors games and ${fmt(S.ttt.games)} games of tic tac toe.`,
  `<div class="grid">
  ${rivalry('Rock paper scissors rivals', S.rps, 'RPS')}
  ${rivalry('Tic tac toe rivals', S.ttt, 'tic tac toe')}
  ${tough ? award('Hardest to beat', [{ id: tough.id }], () => `Won <b>${Math.round((100 * tough.won) / tough.played)}%</b> of ${fmt(tough.played)} rock paper scissors games.`, () => '') : ''}
  </div>`);

/* ---- chaos ---- */
const robbed = S.heists.find((h) => h.status === 'escaped');
const caught = S.heists.filter((h) => h.status === 'caught');
const haul = S.heistHaul.reduce((a, h) => a + h.delta, 0);
const crewCard = (h, title, text) => `<article class="award"><span class="label">${title}</span><div class="winner"><span class="duo">${h.crew.map((c) => av(c)).join('')}</span></div><p class="stat">${h.crew.map((c) => esc(P(c).name)).join(', ')}</p><p class="note">${text}</p></article>`;
html += band('chaos', 'c-chaos', 'Chapter 8', 'Chaos', `Heists, jail time, and the fines nobody saw coming.`,
  `<div class="grid">
  ${robbed ? crewCard(robbed, 'They robbed the vault', `Got away with <b>${fmt(haul)}</b> pebbles, everything in the vault, split ${robbed ? robbed.crew.length : 3} ways.`) : ''}
  ${caught.map((h) => crewCard(h, 'Caught red-handed', `Tried the vault and got caught with the alarm at ${h.alarm}%. Straight to jail.`)).join('')}
  ${award('Most time in jail', S.jail.top, (w) => `<b>${fmt(w.v / 60)}</b> hours behind bars.`, (x) => `${fmt(x.v / 60)} h`)}
  ${award('Fined for Arabic', S.arabicFee.top, (w) => `Paid <b>${fmt(w.v)}</b> pebbles in Arabic-letter fees.`, (x) => fmt(x.v))}
  ${S.poker.biggestPot ? award('Biggest poker pot', [{ id: S.poker.biggestPot.id }], () => `Walked away from a table with <b>${fmt(S.poker.biggestPot.v)}</b> pebbles.`, () => '') : ''}
  </div>`);

/* ---- outro ---- */
html += `<section class="band c-outro"><div class="inner"><span class="kicker">That's a wrap</span><h2>Same time next year?</h2>
  <p class="lead">Every number here comes from the server itself: the chat history, and everything Pebble keeps track of.</p></div></section>`;

document.getElementById('app').innerHTML = html;
document.getElementById('foot').innerHTML = `<p>The Secret Lair, ${day(W.window.from)} to ${day(W.window.to)}. Chat counts come from the message history of every channel Pebble can read; bots are left out. Voice hours come from Pebble's voice pay, so time spent alone in a call, or deafened, doesn't count. Pebbles, casino, drops, cards and games come from Pebble's own records.</p><p>Made by Pebble.</p>`;
</script>
</body>
</html>
