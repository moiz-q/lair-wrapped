:root {

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--base); color: var(--ink); font: 16px/1.5 var(--body); -webkit-font-smoothing: antialiased; }

.inner { position: relative; max-width: 1180px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-block: 72px 80px; display: grid; gap: 34px; }

.lead { font-size: clamp(17px, 2vw, 21px); color: var(--ink-2); max-width: 60ch; margin: 0; }
.head { display: grid; gap: 14px; }

.big { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); gap: 26px 34px; }

.big .k { color: var(--ink-2); font-size: 15px; margin-top: 6px; }
.big > div { border-top: 3px solid var(--hot); padding-top: 14px; min-width: 0; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 18px; align-items: start; }

.stat { font-size: 17px; color: var(--ink); margin: 0; }

.note { font-size: 14px; color: var(--ink-2); margin: 0; }
.av { width: 64px; height: 64px; border-radius: 50%; flex: none; object-fit: cover; background: color-mix(in oklab, var(--hot) 40%, var(--bg)); display: grid; place-items: center; font: 700 24px/1 var(--display); color: var(--ink); box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--hot); }

    <div class="winner">${av(w.id)}${who(w.id)}</div><p class="stat">${stat(w)}</p>${extra}${runners(list, val)}</article>`;
}
function pairAward(label, list, stat, val, extra = '') {
  if (!list || !list.length) return '';

  return `<article class="award"><span class="label">${label}</span>
    <div class="winner"><span class="duo">${av(w.a)}${av(w.b)}</span><div class="who"><span class="name">${esc(P(w.a).name)} & ${esc(P(w.b).name)}</span></div></div>
    <p class="stat">${stat(w)}</p>${extra}${pairRunners(list, val)}</article>`;
}

  if (!r?.topPair) return '';

  const lead = wa === wb ? 'Dead level.' : `${esc(P(wa > wb ? a : b).name)} leads.`;
  return `<article class="award"><span class="label">${label}</span>
    <div class="vs"><div class="side">${av(a)}<span class="name">${esc(P(a).name)}</span></div><span class="score">${wa}–${wb}</span><div class="side">${av(b)}<span class="name">${esc(P(b).name)}</span></div></div>
    <p class="note">${plural(games, `${game} game`)} against each other${draws ? `, ${plural(draws, 'draw')}` : ''}. ${lead}</p></article>`;
}

const source = document.createElement('template');

const intro = source.content.querySelector('.c-intro');
const outro = source.content.querySelector('.c-outro');
const slides = [{ theme: 'c-intro', opening: intro }];
const chapters = [{ name: 'Start', index: 0 }];
const results = [];
for (const section of source.content.querySelectorAll('section[id]')) {
  const cards = section.querySelectorAll('article.award');
  if (!cards.length) continue;
  const chapter = section.querySelector('h2').textContent;
  chapters.push({ name: chapter, index: slides.length });
  const theme = [...section.classList].find((name) => name.startsWith('c-'));
  for (const card of cards) {
    const title = card.querySelector('.label').textContent;
    slides.push({ theme, chapter, title, card });

  results.push({ chapter, theme, cards });

chapters.push({ name: 'All results', index: slides.length });
slides.push({ theme: 'c-outro', results: true });
const resultsPage = () => `<div class="results-layout">
  <div class="story-copy"><h2>All results</h2><p class="lead">Every award from this edition, by chapter.</p></div>
  ${results.map(({ chapter, theme, cards }) => `<section class="results-section ${theme}">
    <h3>${esc(chapter)}</h3><div class="grid">${[...cards].map((card) => card.outerHTML).join('')}</div>
  </section>`).join('')}
</div>`;

const stage = document.getElementById('stage');
const chapterSelect = document.getElementById('chapter');
const nextButton = document.getElementById('next');
const backButton = document.getElementById('back');
const progress = document.getElementById('progress');
const position = document.getElementById('position');
for (const chapter of chapters) chapterSelect.add(new Option(chapter.name, chapter.index));
progress.max = slides.length;
let current = 0;
let places = [];
let revealedCount = 0;

function show(index, focus = true) {
  current = Math.max(0, Math.min(index, slides.length - 1));
  revealedCount = 0;
  const slide = slides[current];
  const runnerList = slide.card?.querySelector('.runners');
  places = runnerList ? [...runnerList.children].filter((row) => /^\d+$/.test(row.querySelector('.rk')?.textContent ?? '')).reverse() : [];
  stage.className = `story-stage band ${slide.theme}${slide.results ? ' results-stage' : ''}`;
  const copy = slide.card
    ? `<span class="kicker">${esc(slide.chapter)}</span><h2>${esc(slide.title)}</h2>`
    : slide.results ? ''
    : [...(slide.opening ?? slide.closing).querySelector('.inner').children]
      .filter((item) => !item.matches('.big')).map((item) => item.outerHTML).join('');
  const panel = slide.card
    ? `<button type="button" class="story-cover"><span class="question" aria-hidden="true">?</span><span>${places.length ? `Reveal #${places.length + 1}` : 'Reveal result'}</span></button>`
    : slide.results ? ''
    : slide.closing ? intro.querySelector('.big').outerHTML
      : '<button type="button" class="story-cover"><span class="question" aria-hidden="true">✦</span><span>Start story</span></button>';
  stage.innerHTML = slide.results ? resultsPage() : `<div class="story-layout"><div class="story-copy">${copy}</div><div class="story-panel">${panel}</div></div>`;
  const heading = stage.querySelector('h1, h2');
  heading.tabIndex = -1;
  if (focus) {
    heading.focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }
  stage.querySelector('.story-cover')?.addEventListener('click', next);
  chapterSelect.value = chapters.findLast((chapter) => chapter.index <= current).index;
  position.textContent = `${current + 1} / ${slides.length}`;
  progress.value = current + (slide.card ? .5 : 1);
  backButton.disabled = current === 0;
  nextButton.textContent = slide.card
    ? (places.length ? `Reveal #${places.length + 1}` : 'Reveal')
    : slide.results ? 'Replay ↻' : slide.closing ? 'All results →' : 'Start →';
}

function reveal() {
  const slide = slides[current];
  const panel = stage.querySelector('.story-panel');
  revealedCount++;
  if (revealedCount <= places.length) {
    const card = document.createElement('article');
    card.className = 'award story-reveal';
    const title = document.createElement('h3');
    title.textContent = `#${places.length + 2 - revealedCount}`;
    const board = document.createElement('ol');
    board.className = 'runners';
    board.append(...places.slice(0, revealedCount).reverse().map((row) => row.cloneNode(true)));
    card.append(title, board);
    panel.replaceChildren(card);
    card.tabIndex = -1;
    card.focus({ preventScroll: true });
    nextButton.textContent = `Reveal #${places.length + 1 - revealedCount}`;
    progress.value = current + .5 + .5 * revealedCount / (places.length + 1);
    return;
  }
  const card = slide.card.cloneNode(true);
  card.classList.add('story-reveal');
  card.tabIndex = -1;
  panel.replaceChildren(card);
  card.focus({ preventScroll: true });
  progress.value = current + 1;
  nextButton.textContent = 'Next →';
}

function next() {
  if (slides[current].card && revealedCount <= places.length) reveal();
  else show(current === slides.length - 1 ? 0 : current + 1);
}
nextButton.addEventListener('click', next);
backButton.addEventListener('click', () => show(current - 1));
chapterSelect.addEventListener('change', () => show(Number(chapterSelect.value)));
document.addEventListener('keydown', (event) => {
  if (event.target.matches('select, input, textarea') || event.altKey || event.metaKey || event.ctrlKey) return;
  if (event.key === 'ArrowRight') { event.preventDefault(); next(); }
  if (event.key === 'ArrowLeft') { event.preventDefault(); if (current > 0) show(current - 1); }
});
show(0, false);
</script>
</body>
</html>
